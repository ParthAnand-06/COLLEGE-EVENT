plugins {
    id 'java'
    id 'application'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}


application {
    mainClass= 'org.example.Main'
}
jar{
    manifest{
        attributes 'main-Class' : 'org.example.Main'
    }
}
tasks.register ('copyWebsite',Copy){
    from 'src/main/resources'
    into 'docs'
}